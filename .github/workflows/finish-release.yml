# Runs when a release is published. For drafts prepared by wiki-update.yml (they carry a patch-vPREV-to-vX.zip), it
# finishes what release.sh does locally: moves the patch to the "updates" pre-release the app's updater reads,
# hides the previous release (draft, tag removed), merges the update into main and closes the "ready" issue.
# Releases made with release.sh carry no patch on the release itself, so this does nothing for them.
name: Finish release

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write

jobs:
  finish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the patch
        id: patch
        run: |
          name=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -E '^patch-v.+-to-v.+\.zip$' || true)
          if [ -z "$name" ]; then echo "Not a prepared wiki update; nothing to do."; echo "name=" >> "$GITHUB_OUTPUT"; exit 0; fi
          prev=$(echo "$name" | sed -E 's/^patch-v(.+)-to-v.+\.zip$/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Move the patch to the updates release
        if: steps.patch.outputs.name != ''
        run: |
          name=${{ steps.patch.outputs.name }}
          gh release download "$TAG" --repo "$REPO" --pattern "$name" --dir "$RUNNER_TEMP"
          gh release view updates --repo "$REPO" > /dev/null 2>&1 \
            || gh release create updates --repo "$REPO" --prerelease --title "Patch updates" --notes "Small update files used by GearCalc's updater."
          gh release upload updates "$RUNNER_TEMP/$name" --repo "$REPO" --clobber
          gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes

      - name: Hide the previous release
        if: steps.patch.outputs.name != ''
        run: |
          prev=${{ steps.patch.outputs.prev }}
          gh release edit "v$prev" --repo "$REPO" --draft=true || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/v$prev" || true

      - name: Merge the update into main
        if: steps.patch.outputs.name != ''
        run: |
          branch="wiki-update/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit "origin/$branch"
          git push origin main
          git push origin --delete "$branch" || true

      - name: Close the "ready to publish" issue
        if: steps.patch.outputs.name != ''
        run: |
          for n in $(gh issue list --repo "$REPO" --state open --search "GearCalc $TAG is ready to publish in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "Published: ${{ github.event.release.html_url }}"
          done
